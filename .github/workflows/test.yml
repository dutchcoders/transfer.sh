name: test
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_version:
          - '1.25'
          - '1.26'
          - '1.27'
          - tip
    name: Test with ${{ matrix.go_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Go ${{ matrix.go_version }}
        if: ${{ matrix.go_version != 'tip' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}
          check-latest: true
      - name: Install Go ${{ matrix.go_version }}
        if: ${{ matrix.go_version == 'tip' }}
        run: |
          go install golang.org/dl/gotip@latest
          `go env GOPATH`/bin/gotip download
      - name: Vet and test no tip
        if: ${{ matrix.go_version != 'tip' }}
        run: |
          go version
          go vet ./...
          go test ./...
      - name: Vet and test gotip
        if: ${{ matrix.go_version == 'tip' }}
        run: |
          `go env GOPATH`/bin/gotip version
          `go env GOPATH`/bin/gotip vet ./...
          `go env GOPATH`/bin/gotip test ./...
  golangci:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: "--config .golangci.yml"
